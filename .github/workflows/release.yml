name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Resolve version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    # Older Ubuntu keeps the glibc requirement low so the binary runs on more distributions.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Test
        run: dotnet test --solution EspumaPdf.slnx -c Release

      - name: Publish
        run: dotnet publish src/Espuma.Desktop -c Release -r linux-x64 -p:Version="$VERSION" -o publish/linux-x64

      - name: Build AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          packaging/linux/build-appimage.sh publish/linux-x64 "EspumaPdf-$VERSION-x86_64.AppImage" ./appimagetool

      - name: Build tarball
        run: |
          mkdir -p "dist/EspumaPdf-$VERSION"
          cp -a publish/linux-x64 "dist/EspumaPdf-$VERSION/bin"
          cp packaging/linux/espumapdf.desktop packaging/linux/espumapdf.png packaging/linux/install.sh "dist/EspumaPdf-$VERSION/"
          tar -czf "EspumaPdf-$VERSION-linux-x64.tar.gz" -C dist "EspumaPdf-$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            EspumaPdf-*.AppImage
            EspumaPdf-*-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --solution EspumaPdf.slnx -c Release

      - name: Publish
        run: dotnet publish src/Espuma.Desktop -c Release -r win-x64 -p:Version="$env:VERSION" -o "publish/EspumaPdf-$env:VERSION"

      - name: Build zip
        run: Compress-Archive -Path "publish/EspumaPdf-$env:VERSION" -DestinationPath "EspumaPdf-$env:VERSION-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: EspumaPdf-*-win-x64.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes
        run: packaging/release-notes.sh "${GITHUB_REF_NAME#v}" CHANGELOG.md > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s notes.md ]]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "EspumaPdf $GITHUB_REF_NAME" "${notes[@]}"
